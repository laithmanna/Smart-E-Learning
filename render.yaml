# Render Blueprint — deploys API + Web + Postgres in one go.
# Apply at: https://dashboard.render.com/blueprints
#
# Service URLs after first deploy:
#   API → https://smart-elearning-api.onrender.com
#   Web → https://smart-elearning-web.onrender.com
#
# After the FIRST deploy you must:
#   1. Set SUPERADMIN_EMAIL + SUPERADMIN_PASSWORD on the API service (marked sync:false below).
#   2. Trigger a "Deploy → Clear build cache & deploy" so the pre-deploy seed runs.
#
# Free-tier notes:
#   - Web services spin down after ~15 min idle; first hit cold-starts (~30s).
#   - Free Postgres is deleted after 90 days of free-tier use.
#   - Free-tier services do NOT support Disks → uploads are wiped on every deploy.
#     If you need persistent uploads, upgrade the API service to Starter ($7/mo)
#     and uncomment the `disk:` block below + change UPLOAD_DIR to /var/data/uploads.

databases:
  - name: smart-elearning-db
    plan: free
    databaseName: smart_elearning
    user: sel
    postgresMajorVersion: '16'

services:
  # ─── NestJS API ───────────────────────────────────────────────────────────
  - type: web
    name: smart-elearning-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    healthCheckPath: /docs
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.5.0 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @sel/api exec prisma generate
      pnpm --filter @sel/api build
    preDeployCommand: |
      cd apps/api && pnpm exec prisma migrate deploy && pnpm prisma:seed || true
    startCommand: pnpm --filter @sel/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-elearning-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://smart-elearning-web.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
      # Set these manually in the Render dashboard after the service is created:
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
    # Uncomment to persist uploads (requires Starter plan or higher):
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1

  # ─── Next.js Web ──────────────────────────────────────────────────────────
  - type: web
    name: smart-elearning-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.5.0 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @sel/web build
    startCommand: pnpm --filter @sel/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://smart-elearning-api.onrender.com/api
