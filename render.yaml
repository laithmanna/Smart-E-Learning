# Render Blueprint — deploys API + Web + Postgres in one go.
# Apply at: https://dashboard.render.com/blueprints
#
# Service URLs after first deploy:
#   API → https://smart-elearning-api.onrender.com
#   Web → https://smart-elearning-web.onrender.com
#
# After the FIRST deploy you must:
#   1. Set SUPERADMIN_EMAIL + SUPERADMIN_PASSWORD on the API service (marked sync:false below).
#   2. Trigger a "Deploy → Clear build cache & deploy" so the pre-deploy seed runs.
#
# Plan notes:
#   - The API runs on Starter ($7/mo) because pre-deploy commands and Disks
#     require a paid plan. The 1 GB Disk mounted at /var/data/uploads keeps
#     user-uploaded files across deploys.
#   - The Web stays on the free plan (spins down after ~15 min idle).
#     Upgrade to starter if you want zero cold-starts.
#   - Free Postgres is deleted after 90 days of free-tier use — upgrade to
#     basic-256mb or higher to keep data permanently.

databases:
  - name: smart-elearning-db
    plan: free
    databaseName: smart_elearning
    user: sel
    postgresMajorVersion: '16'

services:
  # ─── NestJS API ───────────────────────────────────────────────────────────
  - type: web
    name: smart-elearning-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    healthCheckPath: /docs
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @sel/api exec prisma generate
      pnpm --filter @sel/api build
    preDeployCommand: cd apps/api && pnpm exec prisma migrate deploy && pnpm prisma:seed
    startCommand: pnpm --filter @sel/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-elearning-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://smart-elearning-web.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Set these manually in the Render dashboard after the service is created:
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

  # ─── Next.js Web ──────────────────────────────────────────────────────────
  - type: web
    name: smart-elearning-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @sel/web build
    startCommand: pnpm --filter @sel/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://smart-elearning-api.onrender.com/api
